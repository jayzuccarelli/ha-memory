name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build memory.zip
        run: |
          cd custom_components/memory
          zip -r memory.zip . -x '*__pycache__*' '*.pyc'

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: custom_components/memory/memory.zip
